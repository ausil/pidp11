# /etc/pidp11/pidp11.conf - read by pidp11-run when pidp11-simh.service starts.
# Restart the service after changing it: systemctl restart pidp11-simh

# Which system to boot, as the octal number from systems/selections.
#   panel  use the front-panel SR switches (default). The switches are read
#          each time the simulator (re)starts, so set them and reboot.
#          Without a panel this falls back to 0000.
#   0000   a fixed choice, e.g. 0000 for the idle-LED demo or 0211 for 2.11BSD+
PIDP11_BOOT=panel
