# /etc/pidp11/pidp11.conf - read by pidp11-run when pidp11-simh.service starts.
# Restart the service after changing it: systemctl restart pidp11-simh

# Which system to boot, as the octal number from systems/selections
# (0000 is the idle-LED demo). Set to "panel" to read the front-panel SR
# switches instead; only meaningful on a host with a real PiDP-11 panel.
PIDP11_BOOT=0000
